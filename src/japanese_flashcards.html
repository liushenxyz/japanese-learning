<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日語単語帳</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=DM+Mono:ital,wght@0,300;1,300&display=swap');

:root {
  --bg: #f4f2ed;
  --surface: #ffffff;
  --surface2: #f0ede7;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #1c1917;
  --text2: #6b6560;
  --text3: #a09b94;
  --accent: #2d5a3d;
  --accent-h: #234831;
  --accent-light: #e7f2eb;
  --red: #8b3a2a;
  --red-light: #fdf0ec;
  --gold: #7a5e18;
  --gold-light: #fdf7e4;
  --blue: #1c4478;
  --blue-light: #e6f0fa;
  --shadow-card: 0 4px 24px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.07);
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 24px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* topbar */
.topbar { height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 14px; position: sticky; top: 0; z-index: 100; }
.logo { font-family: 'Noto Sans JP', sans-serif; font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: .03em; }
.tsep { flex: 1; }
.stat-badge { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.pill { background: var(--accent-light); color: var(--accent); font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 20px; }

/* subtabs */
.subtabs { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; padding: 0 20px; }
.stab { font-size: 13px; font-weight: 500; padding: 11px 16px; border: none; background: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
.stab:hover { color: var(--text2); }
.stab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; }
.tab-panel.on { display: block; }

/* study layout */
.study-page { max-width: 760px; margin: 0 auto; padding: 20px 20px 52px; display: flex; flex-direction: column; gap: 14px; }

/* progress row */
.prog-row { display: flex; align-items: center; gap: 10px; }
.prog-counter { font-size: 13px; color: var(--text2); font-weight: 500; white-space: nowrap; }
.prog-bar { flex: 1; height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .35s ease; }
.mode-btns { display: flex; gap: 6px; }
.mode-btn { height: 32px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--border2); background: var(--surface); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; gap: 4px; transition: all .15s; }
.mode-btn:hover { background: var(--surface2); }
.mode-btn.on { background: var(--text); color: white; border-color: var(--text); }

/* pos filter */
.pos-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pos-label { font-size: 12px; color: var(--text3); white-space: nowrap; }
.pos-btn { height: 34px; padding: 0 16px; border-radius: 100px; border: 1px solid var(--border2); background: var(--surface); font-size: 13px; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; transition: all .15s; white-space: nowrap; }
.pos-btn:hover { background: var(--surface2); }
.pos-btn.on { background: var(--text); color: white; border-color: var(--text); font-weight: 500; }

/* card */
.card-scene { width: 100%; perspective: 1200px; cursor: pointer; }
.card-3d { width: 100%; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); }
.card-3d.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; border-radius: var(--r-xl); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }

/* front */
.cf { background: var(--surface); border: 1px solid var(--border2); box-shadow: var(--shadow-card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 52px 36px 68px; position: relative; }
.cf-hint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text3); white-space: nowrap; }
.cf-source { position: absolute; top: 20px; left: 22px; font-size: 10px; color: var(--text3); letter-spacing: .06em; }
.cf-pos-badge { font-size: 12px; font-weight: 400; padding: 4px 14px; border-radius: 20px; background: #ede8ff; color: #4c35b5; }
.cf-kanji { font-family: 'Noto Sans JP', sans-serif; font-size: 72px; font-weight: 400; color: var(--text); line-height: 1.15; text-align: center; letter-spacing: .02em; }
.cf-kana { font-size: 22px; color: #3d8b60; font-weight: 500; letter-spacing: .06em; margin-top: 2px; }
.cf-roman { font-family: 'DM Mono', monospace; font-style: italic; font-size: 13px; color: var(--text3); font-weight: 300; margin-top: -4px; }
.cf-audio { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.cf-audio:hover { background: var(--accent-light); transform: scale(1.07); }
.cf-audio.spin { animation: pulse .6s; background: var(--accent); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }

/* back */
.cb { background: var(--surface); transform: rotateY(180deg); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border2); box-shadow: var(--shadow-card); }
.cb-top { padding: 22px 26px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
.cb-trans-wrap { flex: 1; }
.cb-trans { font-family: 'Noto Sans JP', sans-serif; font-size: 26px; font-weight: 500; color: var(--text); line-height: 1.4; }
.cb-pos-lbl { font-size: 11px; color: var(--text3); margin-top: 4px; }
.cb-spk { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all .15s; margin-top: 4px; }
.cb-spk:hover { background: var(--accent-light); }
.cb-spk.spin { animation: pulse .6s; }
.cb-scroll { flex: 1; overflow-y: auto; padding: 16px 26px 20px; display: flex; flex-direction: column; gap: 12px; }

/* example */
.ex-block { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px 18px; }
.ex-lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.ex-jp { font-size: 15px; color: #2d6e4a; font-weight: 500; line-height: 1.85; margin-bottom: 6px; }
.ex-kana { font-size: 13px; color: var(--text2); line-height: 1.85; margin-bottom: 4px; }
.ex-roman { font-family: 'DM Mono', monospace; font-style: italic; font-size: 11px; font-weight: 300; color: var(--text3); margin-bottom: 12px; }
.ex-audio-row { display: flex; align-items: center; gap: 10px; }
.ex-spk-btn { display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 11px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all .15s; flex-shrink: 0; }
.ex-spk-btn:hover { background: var(--accent-light); color: var(--accent); border-color: rgba(45,90,61,.2); }
.ex-zh { font-size: 12px; color: var(--text3); }

/* grammar */
.gm-block { background: #f0f7f2; border: 1px solid rgba(45,90,61,.15); border-radius: var(--r-md); padding: 12px 14px; }
.gm-lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.gm-text { font-size: 12px; color: var(--text2); line-height: 1.8; }
.grammar-tag { font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 4px; display: inline-block; margin-right: 4px; vertical-align: middle; }
.grammar-tag.n5 { background: #fdf7e4; color: #7a5e18; }
.grammar-tag.n4 { background: #e6f0fa; color: #1c4478; }
.grammar-tag.n3 { background: #e7f2eb; color: #2d5a3d; }
.grammar-tag.n2 { background: #fdf0ec; color: #8b3a2a; }
.grammar-tag.n1 { background: #f3edf8; color: #5a2d7a; }

/* card height (set via JS after render) */
.card-scene { min-height: 340px; }
.card-scene .card-3d { min-height: 340px; }

/* bottom */
.card-bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.nav-row { display: flex; align-items: center; gap: 10px; }
.nav-btn { height: 44px; padding: 0 24px; border-radius: 100px; border: 1px solid var(--border2); background: var(--surface); font-size: 14px; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; font-weight: 500; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); transition: all .15s; }
.nav-btn:hover { background: var(--surface2); }
.nav-btn:disabled { opacity: .28; cursor: not-allowed; }
.rate-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rate-label { font-size: 11px; color: var(--text3); }
.rate-btn { height: 34px; padding: 0 16px; border-radius: 100px; border: 1px solid var(--border2); font-size: 12px; font-weight: 500; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.rate-btn.again { background: var(--red-light); color: var(--red); border-color: rgba(139,58,42,.2); }
.rate-btn.again:hover { background: var(--red); color: white; }
.rate-btn.hard { background: var(--gold-light); color: var(--gold); border-color: rgba(122,94,24,.2); }
.rate-btn.hard:hover { background: var(--gold); color: white; }
.rate-btn.ok { background: var(--blue-light); color: var(--blue); border-color: rgba(28,68,120,.2); }
.rate-btn.ok:hover { background: var(--blue); color: white; }
.rate-btn.easy { background: var(--accent-light); color: var(--accent); border-color: rgba(45,90,61,.2); }
.rate-btn.easy:hover { background: var(--accent); color: white; }

/* quiz */
.quiz-choices { display: none; flex-direction: column; gap: 8px; }
.quiz-choices.show { display: flex; }
.qc-btn { height: 46px; border-radius: var(--r-sm); border: 1px solid var(--border2); background: var(--surface); font-size: 14px; cursor: pointer; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-weight: 400; text-align: left; padding: 0 18px; transition: all .15s; }
.qc-btn:hover { background: var(--surface2); border-color: var(--border2); }
.qc-btn.correct { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.qc-btn.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); }

/* list — table layout */
.list-page { max-width: 1100px; margin: 0 auto; padding: 20px; }
.list-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search-box { flex: 1; min-width: 160px; height: 36px; border-radius: var(--r-sm); border: 1px solid var(--border2); background: var(--surface); padding: 0 12px; font-size: 13px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; outline: none; transition: border-color .15s; }
.search-box:focus { border-color: var(--accent); }
.lf-btn { height: 32px; padding: 0 12px; border-radius: 100px; border: 1px solid var(--border2); background: var(--surface); font-size: 12px; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.lf-btn:hover, .lf-btn.on { background: var(--accent); color: white; border-color: var(--accent); }

.vtable-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.vtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.vtable thead tr { background: var(--surface2); border-bottom: 1px solid var(--border2); }
.vtable th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: .05em; white-space: nowrap; }
.vtable tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; cursor: pointer; }
.vtable tbody tr:last-child { border-bottom: none; }
.vtable tbody tr:hover { background: var(--surface2); }
.vtable tbody tr.vt-done { opacity: .42; }
.vtable td { padding: 13px 14px; vertical-align: middle; }

.vt-kanji { font-family: 'Noto Sans JP', sans-serif; font-size: 18px; font-weight: 400; color: var(--text); white-space: nowrap; }
.vt-kana { font-size: 12px; color: #3d8b60; font-weight: 500; margin-top: 2px; white-space: nowrap; }
.vt-trans { color: var(--text); font-size: 13px; }
.vt-pos { font-size: 11px; color: var(--text2); white-space: nowrap; }
.vt-lv { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
.vt-spk { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all .12s; }
.vt-spk:hover { background: var(--accent-light); }
.vt-ex { font-size: 12px; color: var(--text2); line-height: 1.6; max-width: 260px; }
.vt-ex-jp { color: #2d6e4a; font-weight: 500; margin-bottom: 1px; }
.vt-ex-spk { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--border2); background: var(--surface); color: var(--text3); font-size: 10px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all .12s; margin-top: 4px; white-space: nowrap; }
.vt-ex-spk:hover { background: var(--accent-light); color: var(--accent); border-color: rgba(45,90,61,.2); }
.vt-done-mark { font-size: 12px; color: var(--accent); margin-right: 4px; }
.vt-ok { font-size: 12px; color: var(--accent); font-weight: 600; margin-right: 4px; }
.vt-batch { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
.vt-batch.b1 { background: var(--accent-light); color: var(--accent); }
.vt-batch.b2 { background: var(--blue-light); color: var(--blue); }
.vt-batch.bm { background: var(--gold-light); color: var(--gold); }
.empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }

/* upload */
.upload-page { max-width: 680px; margin: 0 auto; padding: 20px 20px 60px; display: flex; flex-direction: column; gap: 18px; }
.dropzone { border: 2px dashed var(--border2); border-radius: var(--r-lg); padding: 52px 32px; text-align: center; cursor: pointer; background: var(--surface); transition: all .2s; }
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-light); }
.dz-icon { font-size: 36px; margin-bottom: 10px; }
.dz-title { font-size: 15px; font-weight: 500; margin-bottom: 5px; }
.dz-sub { font-size: 12px; color: var(--text3); }
#file-inp { display: none; }
.prev-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: var(--r-md); border: 1px solid var(--border); display: none; }
.ai-go { height: 44px; border-radius: var(--r-sm); border: none; background: var(--accent); color: white; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s; }
.ai-go:hover { background: var(--accent-h); }
.ai-go:disabled { background: var(--text3); cursor: not-allowed; }
.ldbar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; display: none; }
.ldfill { height: 100%; background: var(--accent); border-radius: 2px; animation: ld 1.8s ease-in-out infinite; }
@keyframes ld { 0%{width:0;margin-left:0} 50%{width:65%;margin-left:0} 100%{width:0;margin-left:100%} }
.result-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; display: none; }
.rb-head { background: var(--accent-light); padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.rb-title { font-size: 13px; font-weight: 500; color: var(--accent); }
.rb-body { padding: 18px; }
.astream { font-size: 13px; color: var(--text2); line-height: 1.85; white-space: pre-wrap; max-height: 260px; overflow-y: auto; padding: 2px 0 10px; }
.ew { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.ew:last-of-type { border-bottom: none; }
.ew-chk { width: 17px; height: 17px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
.ew-k { font-family: 'Noto Sans JP', sans-serif; font-size: 15px; font-weight: 700; min-width: 72px; }
.ew-kn { font-size: 11px; color: var(--accent); }
.ew-t { font-size: 12px; color: var(--text2); flex: 1; }
.ew-new { font-size: 10px; background: var(--accent-light); color: var(--accent); padding: 1px 6px; border-radius: 8px; font-weight: 500; }
.add-btn { width: 100%; height: 38px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: white; color: var(--accent); font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 14px; font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.add-btn:hover { background: var(--accent); color: white; }

/* toast */
.toast { position: fixed; bottom: 22px; right: 22px; background: var(--text); color: white; padding: 9px 16px; border-radius: var(--r-sm); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }
/* grammar table extra */
.gm-sentence { font-size:13px; color:var(--text); line-height:1.65; }
.gm-sentence u { text-decoration-color:var(--border2); }
.gm-kana { font-size:11px; color:var(--accent); margin-top:2px; line-height:1.5; }
.gm-point { font-size:12px; color:var(--text2); line-height:1.7; }
.gm-point strong { color:var(--text); font-weight:500; }
.freq-badge { display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:500; background:var(--gold-light); color:var(--gold); border:1px solid rgba(122,94,24,.2); padding:2px 7px; border-radius:12px; white-space:nowrap; }
.freq-num { font-size:11px; font-weight:600; color:var(--accent); }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── Mobile ── */
@media (max-width: 600px) {
  /* topbar */
  .topbar { padding: 0 14px; gap: 8px; }
  .logo { font-size: 14px; }
  .stat-badge { font-size: 10px; gap: 4px; }
  .pill { padding: 2px 6px; font-size: 10px; }

  /* subtabs */
  .subtabs { padding: 0 6px; overflow-x: auto; }
  .stab { font-size: 12px; padding: 10px 10px; white-space: nowrap; }

  /* study page */
  .study-page { padding: 12px 12px 60px; gap: 10px; }

  /* prog row */
  .prog-counter { font-size: 12px; }
  .mode-btns { flex-wrap: wrap; gap: 4px; }
  .mode-btn { height: 28px; padding: 0 10px; font-size: 11px; }

  /* pos filter */
  .pos-btn { height: 30px; padding: 0 12px; font-size: 12px; }

  /* card */
  .cf { padding: 40px 20px 56px; gap: 10px; }
  .cf-kanji { font-size: 48px; }
  .cf-kana { font-size: 18px; }
  .cf-roman { font-size: 12px; }
  .cb-top { padding: 16px 16px 12px; }
  .cb-trans { font-size: 22px; }
  .cb-scroll { padding: 12px 16px 16px; gap: 10px; }

  /* nav + rate */
  .nav-btn { height: 40px; padding: 0 18px; font-size: 13px; }
  .rate-row { justify-content: center; }
  .rate-label { width: 100%; text-align: center; }
  .rate-btn { height: 32px; padding: 0 12px; font-size: 11px; flex: 1; text-align: center; }

  /* quiz choices */
  .qc-btn { height: 42px; font-size: 13px; }

  /* list page */
  .list-page { padding: 12px; }
  .list-toolbar { gap: 6px; }
  .search-box { min-width: 100%; }
  .lf-btn { height: 30px; padding: 0 10px; font-size: 11px; }

  /* vocab table → hide less-important columns on mobile */
  /* cols: 1=# 2=汉字 3=译文 4=词性 5=等级 6=批次 7=出现 8=发音 9=例句 */
  .vtable th:nth-child(4),
  .vtable td:nth-child(4),
  .vtable th:nth-child(6),
  .vtable td:nth-child(6),
  .vtable th:nth-child(7),
  .vtable td:nth-child(7),
  .vtable th:nth-child(9),
  .vtable td:nth-child(9) { display: none; }

  .vt-kanji { font-size: 15px; }
  .vt-kana { font-size: 11px; }
  .vtable td { padding: 10px 10px; }
  .vtable th { padding: 8px 10px; }

  /* grammar table: cols 1=# 2=例句 3=中文 4=重点语法 5=等级 6=批次 7=发音 8=高频 */
  #gm-table th:nth-child(4),
  #gm-table td:nth-child(4),
  #gm-table th:nth-child(6),
  #gm-table td:nth-child(6),
  #gm-table th:nth-child(8),
  #gm-table td:nth-child(8) { display: none; }

/* ─── TABS ─── */
function gotoTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+name).classList.add('on');
  btn.classList.add('on');
  if(name==='list') renderList();
  if(name==='grammar') renderGrammar();
}

/* ─── DECK / FILTER ─── */
function setPF(pg, btn) {
  posFilter = pg;
  document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  buildDeck();
}
function buildDeck() {
  let src = posFilter==='all' ? [...vocab] : vocab.filter(w=>w.pg===posFilter);
  if (studyMode==='review') {
    const now = Date.now();
    src = src.filter(w => { const s=srsState[w.id]; return s && s.due<=now; });
  }
  deck = src;
  cur=0; flipped=false;
  document.getElementById('card3d').classList.remove('flipped');
  document.getElementById('pac').textContent = vocab.length;
  updateStats();
  renderCard();
  if(studyMode==='review' && !deck.length) showToast('💡 暂无待复习词汇，先在学习模式中背新词！');
}
function setMode(m, btn) {
  studyMode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  buildDeck();
}
function shuffleCards() {
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  cur=0; flipped=false;
  document.getElementById('card3d').classList.remove('flipped');
  renderCard(); showToast('🔀 已打乱顺序');
}

/* ─── RENDER CARD ─── */
const posColors = {'动词':'#e4f0ff,#1a5c9a','形容词':'#eee8ff,#4a2fa0','名词':'#ede8ff,#4c35b5','副词':'#e4fff5,#1a6a4a','外来語':'#fff3e8,#8a4a1a'};
const lvStyle = {n5:'background:#fdf7e4;color:#7a5e18',n4:'background:#e6f0fa;color:#1c4478',n3:'background:#e7f2eb;color:#2d5a3d',n2:'background:#fdf0ec;color:#8b3a2a',n1:'background:#f3edf8;color:#5a2d7a'};

function renderCard() {
  const rr=document.getElementById('rate-row');
  const qc=document.getElementById('quiz-choices');
  if(!deck.length){
    document.getElementById('prog-lbl').textContent='暂无卡片';
    document.getElementById('prog-fill').style.width='0%';
    document.getElementById('cf-hint').textContent=studyMode==='review'?'🎉 今日没有待复习的词汇！先去学习模式学新词吧':'暂无词汇';
    document.getElementById('cf-kanji').textContent='——';
    document.getElementById('cf-kana').textContent='';
    document.getElementById('cf-roman').textContent='';
    document.getElementById('cf-src').textContent='';
    document.getElementById('cf-pos').textContent='';
    document.getElementById('cf-pos').style.cssText='';
    document.getElementById('cb-trans').textContent='';
    document.getElementById('cb-pos').textContent='';
    document.getElementById('ex-jp').textContent='';
    document.getElementById('ex-kana').textContent='';
    document.getElementById('ex-roman').textContent='';
    document.getElementById('ex-zh').textContent='';
    document.getElementById('cb-gm').innerHTML='';
    document.getElementById('prev-btn').disabled=true;
    document.getElementById('next-btn').disabled=true;
    rr.style.display='none'; qc.classList.remove('show');
    return;
  }
  const w=deck[cur];
  flipped=false;
  document.getElementById('card3d').classList.remove('flipped');

  // progress
  const pct=Math.round((cur+1)/deck.length*100);
  document.getElementById('prog-lbl').textContent=`第 ${cur+1} / ${deck.length} 张`;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===deck.length-1;

  // front — SRS hint
  const srs=getSRS(w.id);
  const hint=document.getElementById('cf-hint');
  if(srs.reps>0){
    const daysLeft=Math.max(0,Math.round((srs.due-Date.now())/86400000));
    hint.textContent=daysLeft===0?'📅 今日应复习':`📅 ${daysLeft}天后复习`;
  } else { hint.textContent='点击卡片查看释义'; }

  document.getElementById('cf-src').textContent=w.src||'';
  const pb=document.getElementById('cf-pos');
  pb.textContent=w.pos;
  const pc=(posColors[w.pg]||'#ede8ff,#4c35b5').split(',');
  pb.style.cssText=`background:${pc[0]};color:${pc[1]};`;
  document.getElementById('cf-kanji').textContent=w.kanji;
  document.getElementById('cf-kana').textContent=w.kana;
  document.getElementById('cf-roman').textContent=w.roman;

  // back
  document.getElementById('cb-trans').textContent=w.trans;
  document.getElementById('cb-pos').textContent=w.pos;
  document.getElementById('ex-jp').textContent=w.ex_jp;
  document.getElementById('ex-kana').textContent=w.ex_kana;
  document.getElementById('ex-roman').textContent=w.ex_roman;
  document.getElementById('ex-zh').textContent=w.ex_zh;
  document.getElementById('cb-gm').innerHTML=w.gm;

  // adjust heights after content is set
  requestAnimationFrame(fixCardHeight);

  // quiz or learn
  if(studyMode==='quiz'){ qc.classList.add('show'); rr.style.display='none'; renderQuiz(w); }
  else { qc.classList.remove('show'); rr.style.display='flex'; }
}

function fixCardHeight() {
  const frontH=document.getElementById('cf-face').scrollHeight;
  const backH=document.getElementById('cb-face').scrollHeight;
  const h=Math.max(frontH, backH, 300);
  const scene=document.getElementById('card-scene');
  const card3d=document.getElementById('card3d');
  scene.style.height=h+'px';
  card3d.style.height=h+'px';
  // back face: limit scroll area
  const cbScroll=document.getElementById('cb-scroll');
  const cbTopH=document.getElementById('cb-face').querySelector('.cb-top').scrollHeight;
  cbScroll.style.maxHeight=(h-cbTopH-2)+'px';
}

function onCardClick() { if(studyMode==='quiz'||!deck.length) return; flipped=!flipped; document.getElementById('card3d').classList.toggle('flipped',flipped); }

/* ─── QUIZ ─── */
function renderQuiz(correct) {
  const pool=vocab.filter(w=>w.id!==correct.id);
  const wrongs=[];
  while(wrongs.length<3&&pool.length){ const i=Math.floor(Math.random()*pool.length); wrongs.push(pool.splice(i,1)[0]); }
  const choices=[correct,...wrongs].sort(()=>Math.random()-.5);
  document.getElementById('quiz-choices').innerHTML=choices.map(c=>`<button class="qc-btn" data-id="${c.id}" onclick="checkQ(${c.id},${correct.id},this)">${c.trans}</button>`).join('');
}
function checkQ(chosen, cid, btn) {
  document.querySelectorAll('.qc-btn').forEach(b=>{ b.onclick=null; });
  if(chosen===cid){ btn.classList.add('correct'); }
  else {
    btn.classList.add('wrong');
    document.querySelectorAll('.qc-btn').forEach(b=>{ if(parseInt(b.dataset.id)===cid) b.classList.add('correct'); });
  }
  document.getElementById('card3d').classList.add('flipped');
  showToast(chosen===cid?'✅ 正确！':'❌ 再想想');
  setTimeout(()=>{ if(cur<deck.length-1) navigate(1); else showToast('🎉 本轮自测完成！'); }, 1400);
}

/* ─── NAV / RATE ─── */
function navigate(d) { const n=cur+d; if(n>=0&&n<deck.length){ cur=n; renderCard(); } }
function rate(q) {
  const w=deck[cur];
  updateSRS(w.id, q);
  if(q>=4){ masteredSet.add(w.id); localStorage.setItem('jp_mastered',JSON.stringify([...masteredSet])); }
  else if(q<=3){ masteredSet.delete(w.id); localStorage.setItem('jp_mastered',JSON.stringify([...masteredSet])); }
  const msgs={1:'再来一次！',3:'下次加油',4:'✅ 记住了！',5:'⭐ 完全掌握！'};
  showToast(msgs[q]||'');
  updateStats();
  if(studyMode==='review'){
    deck.splice(cur,1);
    if(!deck.length){ showToast('🎉 今日复习完成！'); renderCard(); return; }
    cur=Math.min(cur,deck.length-1);
    renderCard();
  } else {
    if(cur<deck.length-1) navigate(1); else showToast('🎉 本轮学习完成！');
  }
}

/* ─── AUDIO ─── */
function speak(text, btn) {
  if(!text) return;
  const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=0.88;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  if(btn){ btn.classList.add('spin'); setTimeout(()=>btn.classList.remove('spin'),700); }
}
function speakWord() { const w=deck[cur]; if(w) speak(w.kana, document.getElementById('cf-spk')); }
function speakEx() { const w=deck[cur]; if(w) speak(w.ex_jp, document.querySelector('.ex-spk-btn')); }

/* ─── LIST ─── */
function renderList() {
  const wrap=document.getElementById('vtable-wrap');
  const src=vocab.filter(w=>{
    const lm=listLF==='all'?true:listLF==='mastered'?masteredSet.has(w.id):w.level===listLF;
    const sm=!listSearch||w.kanji.includes(listSearch)||w.kana.includes(listSearch)||w.trans.includes(listSearch);
    return lm&&sm;
  });
  if(!src.length){
    wrap.innerHTML='<div class="empty"><div style="font-size:32px;margin-bottom:10px">🔍</div>没有匹配的词汇</div>';
    return;
  }
  if(!document.getElementById('vtbody')){
    wrap.innerHTML=`<table class="vtable"><thead><tr><th style="width:40px;text-align:center">#</th><th>汉字</th><th>译文</th><th>词性</th><th>等级</th><th>批次</th><th>出现</th><th>发音</th><th>例句</th></tr></thead><tbody id="vtbody"></tbody></table>`;
  }
  document.getElementById('vtbody').innerHTML=src.map(w=>{
    const lv=lvStyle[w.level]||'';
    const done=masteredSet.has(w.id);
    const exJpSafe=(w.ex_jp||'').replace(/'/g,"\\'");
    const kanaSafe=(w.kana||'').replace(/'/g,"\\'");
    const cnt=w.count||1;
    const cntBadge=cnt>=2
      ? `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:600;background:var(--gold-light);color:var(--gold);border:1px solid rgba(122,94,24,.2);padding:2px 7px;border-radius:12px">⭐ ${cnt}次</span>`
      : `<span style="font-size:12px;color:var(--text3)">${cnt}次</span>`;
    return `<tr class="${done?'vt-done':''}" onclick="jumpStudy(${w.id})" title="点击进入卡片学习">
      <td style="text-align:center;color:var(--text3);font-size:12px;font-family:'DM Mono',monospace">${w.id}</td>
      <td><div style="display:flex;align-items:center;gap:4px">${done?'<span class="vt-ok">✓</span>':''}<div><div class="vt-kanji">${w.kanji}</div><div class="vt-kana">${w.kana}</div></div></div></td>
      <td class="vt-trans">${w.trans}</td>
      <td class="vt-pos">${w.pos}</td>
      <td><span class="vt-lv" style="${lv}">${(w.level||'').toUpperCase()}</span></td>
      <td>${getBatch(w.src)}</td>
      <td style="text-align:center">${cntBadge}</td>
      <td><button class="vt-spk" onclick="event.stopPropagation();speak('${kanaSafe}')" title="朗读单词">🔊</button></td>
      <td><div class="vt-ex"><div class="vt-ex-jp">${w.ex_jp||''}</div><div style="color:var(--text3);font-size:11px;margin-top:1px">${w.ex_zh||''}</div><button class="vt-ex-spk" onclick="event.stopPropagation();speak('${exJpSafe}')">🔊 例句发音</button></div></td>
    </tr>`;
  }).join('');
}
function getBatch(src) {
  if (!src) return '<span style="color:var(--text3);font-size:11px">—</span>';
  if (src.includes('第2回')) return '<span class="vt-batch b2">第2回</span>';
  if (src.includes('混淆')) return '<span class="vt-batch bm">混淆</span>';
  return '<span class="vt-batch b1">第1回</span>';
}
function doSearch(q){ listSearch=q; renderList(); }
function setLF(f,btn){ listLF=f; document.querySelectorAll('.lf-btn').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); renderList(); }
function jumpStudy(id){
  const idx=deck.findIndex(w=>w.id===id);
  if(idx>=0){ cur=idx; gotoTab('study',document.querySelector('.stab')); renderCard(); }
}

/* ─── GRAMMAR ─── */
function renderGrammar(){
  const wrap=document.getElementById('gm-table-wrap');
  const lvStyle2={n5:'background:#fdf7e4;color:#7a5e18',n4:'background:#e6f0fa;color:#1c4478',n3:'background:#e7f2eb;color:#2d5a3d',n2:'background:#fdf0ec;color:#8b3a2a',n1:'background:#f3edf8;color:#5a2d7a'};
  const vocabMap=Object.fromEntries(vocab.map(w=>[w.id,w]));
  const src=GRAMMAR_DATA.filter(g=>{
    const w=vocabMap[g.vocabId];
    if(!w||!w.gm) return false;
    const lm=gmFilter==='all'?true:gmFilter==='high'?g.freq>=2:g.level===gmFilter;
    const sm=!gmSearch||g.sentence.includes(gmSearch)||g.trans.includes(gmSearch)||g.point.includes(gmSearch);
    return lm&&sm;
  });
  if(!src.length){ wrap.innerHTML='<div class="empty"><div style="font-size:28px;margin-bottom:8px">🔍</div>没有匹配的语法</div>'; return; }
  if(!document.getElementById('gm-tbody')){
    wrap.innerHTML=`<table class="vtable" id="gm-table"><thead><tr><th style="width:40px;text-align:center">#</th><th style="min-width:200px">例句（原文）</th><th style="min-width:140px">中文翻译</th><th style="min-width:180px">重点语法</th><th style="width:52px">等级</th><th style="width:72px">批次</th><th style="width:64px">发音</th><th style="width:64px">高频</th></tr></thead><tbody id="gm-tbody"></tbody></table>`;
  }
  document.getElementById('gm-tbody').innerHTML=src.map((g,i)=>{
    const w=vocabMap[g.vocabId];
    const lv=lvStyle2[g.level]||'';
    const exSafe=(g.ex_jp||'').replace(/'/g,"\\'");
    const freqCell=g.freq>=2
      ? `<span class="freq-badge">⭐ ${g.freq}次</span>`
      : `<span style="font-size:11px;color:var(--text3)">1次</span>`;
    const batchHtml=w?getBatch(w.src):'';
    return `<tr onclick="jumpStudy(${g.vocabId})" title="点击跳转到「${w?w.kanji:''}」卡片" style="cursor:pointer">
      <td style="text-align:center;color:var(--text3);font-size:12px;font-family:'DM Mono',monospace">${i+1}</td>
      <td>
        <div class="gm-sentence">${g.sentence}</div>
        <div class="gm-kana">${g.kana}</div>
      </td>
      <td style="font-size:12px;color:var(--text2);line-height:1.6">${g.trans}</td>
      <td><div class="gm-point"><strong>${g.point.split('：')[0]}：</strong>${g.point.split('：').slice(1).join('：')}</div></td>
      <td><span class="vt-lv" style="${lv}">${(g.level||'').toUpperCase()}</span></td>
      <td>${batchHtml}</td>
      <td><button class="vt-spk" onclick="event.stopPropagation();speak('${exSafe}')" title="朗读例句">🔊</button></td>
      <td style="text-align:center">${freqCell}</td>
    </tr>`;
  }).join('');
}
function filterGrammar(q){ gmSearch=q; renderGrammar(); }
function setGF(f,btn){ gmFilter=f; document.querySelectorAll('#tab-grammar .lf-btn').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); renderGrammar(); }

/* ─── UPLOAD ─── */
function doDragOver(e){ e.preventDefault(); document.getElementById('dropzone').classList.add('drag'); }
function doDrop(e){ e.preventDefault(); document.getElementById('dropzone').classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) setFile(f); }
function onFileSelect(e){ const f=e.target.files[0]; if(f) setFile(f); }
function setFile(f){
  uploadedFile=f;
  const r=new FileReader();
  r.onload=ev=>{ const img=document.getElementById('prev-img'); img.src=ev.target.result; img.style.display='block'; };
  r.readAsDataURL(f);
  document.getElementById('ai-btn').disabled=false;
  document.getElementById('result-box').style.display='none';
}
async function runAI(){
  if(!uploadedFile) return;
  const btn=document.getElementById('ai-btn'), ldbar=document.getElementById('ldbar'), rbox=document.getElementById('result-box'), as=document.getElementById('astream'), ewl=document.getElementById('ew-list');
  btn.disabled=true; btn.innerHTML='<span>⏳</span> AI 解析中…';
  ldbar.style.display='block'; rbox.style.display='none'; as.textContent=''; ewl.innerHTML=''; extractedWords=[];
  const b64=await new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result.split(',')[1]); r.readAsDataURL(uploadedFile); });
  const mt=uploadedFile.type||'image/jpeg';
  const sys=`你是JLPT考试分析专家。用户上传日语题目图片。完成：
【题目解析】逐题分析：正确答案、关键语法点（标注N级别）、核心词汇。
【词汇提取】提取所有重要词汇，JSON数组放在 <VOCAB_JSON></VOCAB_JSON> 标签之间：
[{"kanji":"漢字","kana":"かな","roman":"rōmaji","trans":"中文释义","pos":"词性","pg":"名词|动词|形容词|副词|外来語","level":"n3","src":"来源","ex_jp":"例句日语","ex_kana":"例句假名","ex_roman":"例句罗马音","ex_zh":"例句中文","gm":"语法点（可含<span class=grammar-tag n3>N3</span>标签）"}]
level只能是n5/n4/n3/n2/n1。只输JSON，不要多余内容。`;
  try {
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4096,system:sys,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mt,data:b64}},{type:'text',text:'请详细解析图片中的日语题目，提取所有词汇。'}]}]})});
    const data=await resp.json();
    ldbar.style.display='none';
    const full=(data.content||[]).map(c=>c.text||'').join('');
    as.textContent=full.split('<VOCAB_JSON>')[0].trim();
    const jm=full.match(/<VOCAB_JSON>([\s\S]*?)<\/VOCAB_JSON>/);
    if(jm){ try{ extractedWords=JSON.parse(jm[1].trim()); renderEW(); }catch(e){} }
    rbox.style.display='block'; btn.innerHTML='<span>✅</span> 解析完成'; btn.disabled=false;
  } catch(err){
    ldbar.style.display='none'; as.textContent='解析出错：'+err.message;
    rbox.style.display='block'; btn.innerHTML='<span>🤖</span> AI 解析题目 · 提取词汇'; btn.disabled=false;
  }
}
function renderEW(){
  const existing=new Set(vocab.map(w=>w.kanji));
  const ewl=document.getElementById('ew-list');
  if(!extractedWords.length){ ewl.innerHTML='<div style="color:var(--text3);font-size:13px;padding:8px 0">未提取到词汇</div>'; return; }
  ewl.innerHTML=extractedWords.map((w,i)=>{
    const isNew=!existing.has(w.kanji);
    return `<div class="ew"><input type="checkbox" class="ew-chk" id="ew${i}" ${isNew?'checked':''}><div><div class="ew-k">${w.kanji}</div><div class="ew-kn">${w.kana}</div></div><div class="ew-t">${w.trans}</div>${isNew?'<span class="ew-new">新词</span>':'<span style="font-size:10px;color:var(--text3)">已有</span>'}</div>`;
  }).join('');
}
function addToVocab(){
  const existing=new Set(vocab.map(w=>w.kanji));
  let added=0;
  extractedWords.forEach((w,i)=>{ const cb=document.getElementById('ew'+i); if(cb&&cb.checked&&!existing.has(w.kanji)){ vocab.push({...w,id:Date.now()+i}); added++; } });
  if(added){ updateStats(); buildDeck(); showToast(`✅ 已添加 ${added} 个词汇`); }
  else showToast('ℹ️ 没有新词汇被添加');
}

/* ─── SRS ─── */
function getSRS(id){ return srsState[id]||{interval:0,ef:2.5,reps:0,due:0}; }
function updateSRS(id,q){
  const dayMs=86400000;
  let s=getSRS(id);
  if(q===1){ s.reps=0; s.interval=1; }
  else{
    s.reps++;
    if(s.reps===1) s.interval=1;
    else if(s.reps===2) s.interval=(q>=4?4:2);
    else s.interval=Math.max(1,Math.round(s.interval*(q===3?1.2:s.ef)*(q===5?1.3:1)));
    s.ef=Math.max(1.3,s.ef+0.1-(5-q)*(0.08+(5-q)*0.02));
  }
  s.due=Date.now()+s.interval*dayMs;
  srsState[id]=s;
  localStorage.setItem('jp_srs',JSON.stringify(srsState));
}
function getDueCount(){ const now=Date.now(); return vocab.filter(w=>{ const s=srsState[w.id]; return s&&s.due<=now; }).length; }

/* ─── UTILS ─── */
function updateStats(){
  document.getElementById('tc').textContent=vocab.length;
  document.getElementById('mc').textContent=masteredSet.size;
  document.getElementById('pac').textContent=vocab.length;
  const dc=getDueCount();
  document.getElementById('due-c').textContent=dc;
  document.getElementById('due-n').textContent=dc;
}
function exportJSON(){
  const data=JSON.stringify(vocab,null,2);
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);
  a.download='jp_vocab_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  showToast('✅ 词库已导出');
}
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

/* ─── INIT ─── */
buildDeck();
updateStats();
window.addEventListener('resize', fixCardHeight);
</script>
