<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日語単語帳 · 离线版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:ital,wght@0,300;1,300&display=swap');

:root {
  --bg: #f4f2ed;
  --surface: #ffffff;
  --surface2: #f0ede7;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #1c1917;
  --text2: #6b6560;
  --text3: #a09b94;
  --accent: #2d5a3d;
  --accent-h: #234831;
  --accent-light: #e7f2eb;
  --red: #8b3a2a;
  --red-light: #fdf0ec;
  --gold: #7a5e18;
  --gold-light: #fdf7e4;
  --green-txt: #3d8b60;
  --shadow: 0 4px 24px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.07);
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 22px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* ── topbar ── */
.topbar {
  height: 52px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 10px;
  position: sticky; top: 0; z-index: 200;
}
.logo { font-size: 15px; font-weight: 700; color: var(--accent); flex: 1; }
.offline-badge { font-size: 10px; background: var(--gold-light); color: var(--gold); border: 1px solid rgba(122,94,24,.2); padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.stat-row { font-size: 11px; color: var(--text3); display: flex; gap: 6px; align-items: center; }
.pill { background: var(--accent-light); color: var(--accent); font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }

/* ── tabs ── */
.tabs { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; font-size: 13px; font-weight: 500; padding: 11px 16px; border: none; background: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
.tab:hover { color: var(--text2); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.pane { display: none; }
.pane.on { display: block; }

/* ── IMPORT pane ── */
.import-page { max-width: 600px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
.import-title { font-size: 16px; font-weight: 600; color: var(--text); }
.import-sub { font-size: 13px; color: var(--text2); line-height: 1.7; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: white; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.step-txt { font-size: 13px; color: var(--text2); line-height: 1.7; }
.step-txt strong { color: var(--text); font-weight: 500; }

.dropzone {
  border: 2px dashed var(--border2); border-radius: var(--r-lg);
  padding: 40px 24px; text-align: center; cursor: pointer;
  background: var(--surface); transition: all .2s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-light); }
.dz-icon { font-size: 32px; margin-bottom: 10px; }
.dz-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
.dz-sub { font-size: 12px; color: var(--text3); }
#json-inp { display: none; }

.import-info { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px; display: none; }
.import-info.show { display: block; }
.import-stat { font-size: 13px; color: var(--text2); margin-bottom: 10px; }
.import-stat strong { color: var(--text); }
.import-btn { width: 100%; height: 44px; border-radius: var(--r-sm); border: none; background: var(--accent); color: white; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: background .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.import-btn:hover { background: var(--accent-h); }
.import-btn.merge { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); margin-top: 8px; }
.import-btn.merge:hover { background: var(--accent-light); }

.lib-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.lib-act-btn { height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--border2); background: var(--surface); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; transition: all .15s; display: flex; align-items: center; gap: 5px; }
.lib-act-btn:hover { background: var(--surface2); }
.lib-act-btn.danger { color: var(--red); border-color: rgba(139,58,42,.2); }
.lib-act-btn.danger:hover { background: var(--red-light); }

.cur-lib { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px; }
.cur-lib-title { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.lib-tag { display: inline-block; font-size: 11px; background: var(--accent-light); color: var(--accent); padding: 1px 8px; border-radius: 10px; }

/* ── STUDY pane ── */
.study-page { max-width: 680px; margin: 0 auto; padding: 16px 14px 80px; display: flex; flex-direction: column; gap: 14px; }

.prog-row { display: flex; align-items: center; gap: 10px; }
.prog-lbl { font-size: 13px; color: var(--text2); font-weight: 500; white-space: nowrap; }
.prog-bar { flex: 1; height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }
.mode-btns { display: flex; gap: 5px; }
.mode-btn { height: 30px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--border2); background: var(--surface); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.mode-btn.on { background: var(--text); color: white; border-color: var(--text); }

.pos-filter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pos-lbl { font-size: 12px; color: var(--text3); white-space: nowrap; }
.pos-btn { height: 30px; padding: 0 12px; border-radius: 100px; border: 1px solid var(--border2); background: var(--surface); font-size: 12px; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; transition: all .15s; white-space: nowrap; }
.pos-btn.on { background: var(--text); color: white; border-color: var(--text); font-weight: 500; }

/* card */
.card-scene { width: 100%; perspective: 1000px; cursor: pointer; user-select: none; }
.card-3d { width: 100%; position: relative; transform-style: preserve-3d; transition: transform .48s cubic-bezier(.4,0,.2,1); }
.card-3d.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; border-radius: var(--r-xl); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }

.cf { background: var(--surface); border: 1px solid var(--border2); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 52px 28px 64px; position: relative; }
.cf-hint { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text3); white-space: nowrap; }
.cf-src { position: absolute; top: 16px; left: 16px; font-size: 10px; color: var(--text3); }
.cf-pos { font-size: 12px; padding: 3px 12px; border-radius: 20px; background: #ede8ff; color: #4c35b5; }
.cf-kanji { font-size: 64px; font-weight: 400; color: var(--text); line-height: 1.15; text-align: center; letter-spacing: .02em; }
.cf-kana { font-size: 20px; color: var(--green-txt); font-weight: 500; letter-spacing: .06em; margin-top: 2px; }
.cf-roman { font-family: 'DM Mono', monospace; font-style: italic; font-size: 12px; color: var(--text3); font-weight: 300; margin-top: -4px; }
.spk-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
.spk-btn:hover, .spk-btn:active { background: var(--accent-light); transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
.spk-btn.spin { animation: pulse .55s; }

.cb { background: var(--surface); transform: rotateY(180deg); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border2); box-shadow: var(--shadow); }
.cb-top { padding: 20px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; }
.cb-tw { flex: 1; }
.cb-trans { font-size: 24px; font-weight: 500; color: var(--text); line-height: 1.4; }
.cb-pos { font-size: 11px; color: var(--text3); margin-top: 4px; }
.cb-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 12px; }

.ex-block { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px; }
.ex-lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.ex-jp { font-size: 14px; color: #2d6e4a; font-weight: 500; line-height: 1.85; margin-bottom: 6px; }
.ex-kana { font-size: 12px; color: var(--text2); line-height: 1.85; margin-bottom: 3px; }
.ex-roman { font-family: 'DM Mono', monospace; font-style: italic; font-size: 11px; font-weight: 300; color: var(--text3); margin-bottom: 10px; }
.ex-audio-row { display: flex; align-items: center; gap: 8px; }
.ex-spk { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 11px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.ex-spk:hover { background: var(--accent-light); color: var(--accent); }
.ex-zh { font-size: 12px; color: var(--text3); }

.gm-block { background: #f0f7f2; border: 1px solid rgba(45,90,61,.14); border-radius: var(--r-md); padding: 12px 14px; }
.gm-lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.gm-text { font-size: 12px; color: var(--text2); line-height: 1.8; }
.grammar-tag { font-size: 10px; font-weight: 500; padding: 1px 5px; border-radius: 4px; display: inline-block; margin-right: 3px; vertical-align: middle; }
.grammar-tag.n5 { background: #fdf7e4; color: #7a5e18; }
.grammar-tag.n4 { background: #e6f0fa; color: #1c4478; }
.grammar-tag.n3 { background: #e7f2eb; color: #2d5a3d; }
.grammar-tag.n2 { background: #fdf0ec; color: #8b3a2a; }
.grammar-tag.n1 { background: #f3edf8; color: #5a2d7a; }

.card-scene { min-height: 300px; }
.card-3d { min-height: 300px; }

/* nav */
.card-bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.nav-row { display: flex; gap: 10px; }
.nav-btn { height: 44px; padding: 0 22px; border-radius: 100px; border: 1px solid var(--border2); background: var(--surface); font-size: 14px; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; font-weight: 500; box-shadow: var(--shadow-sm); transition: all .15s; }
.nav-btn:active { transform: scale(.96); }
.nav-btn:disabled { opacity: .28; cursor: not-allowed; }
.rate-row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: center; }
.rate-lbl { font-size: 11px; color: var(--text3); }
.rate-btn { height: 34px; padding: 0 14px; border-radius: 100px; border: 1px solid var(--border2); font-size: 12px; font-weight: 500; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.rate-btn:active { transform: scale(.95); }
.rate-btn.hard { background: var(--red-light); color: var(--red); border-color: rgba(139,58,42,.2); }
.rate-btn.hard:hover { background: var(--red); color: white; }
.rate-btn.ok { background: var(--gold-light); color: var(--gold); border-color: rgba(122,94,24,.2); }
.rate-btn.ok:hover { background: var(--gold); color: white; }
.rate-btn.easy { background: var(--accent-light); color: var(--accent); border-color: rgba(45,90,61,.2); }
.rate-btn.easy:hover { background: var(--accent); color: white; }

/* quiz */
.quiz-choices { display: none; flex-direction: column; gap: 8px; }
.quiz-choices.show { display: flex; }
.qc-btn { height: 48px; border-radius: var(--r-sm); border: 1px solid var(--border2); background: var(--surface); font-size: 14px; cursor: pointer; color: var(--text); font-family: 'Noto Sans JP', sans-serif; text-align: left; padding: 0 16px; transition: all .15s; }
.qc-btn:active { transform: scale(.98); }
.qc-btn.correct { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.qc-btn.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); }

/* ── LIST pane ── */
.list-page { max-width: 1000px; margin: 0 auto; padding: 16px 14px 60px; }
.list-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.search-box { flex: 1; min-width: 140px; height: 36px; border-radius: var(--r-sm); border: 1px solid var(--border2); background: var(--surface); padding: 0 12px; font-size: 13px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; outline: none; }
.search-box:focus { border-color: var(--accent); }
.lf-btn { height: 30px; padding: 0 11px; border-radius: 100px; border: 1px solid var(--border2); background: var(--surface); font-size: 11px; cursor: pointer; color: var(--text2); font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.lf-btn.on { background: var(--accent); color: white; border-color: var(--accent); }

.vtable-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.vtable { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
.vtable thead tr { background: var(--surface2); border-bottom: 1px solid var(--border2); }
.vtable th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: .04em; white-space: nowrap; }
.vtable tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.vtable tbody tr:last-child { border-bottom: none; }
.vtable tbody tr:hover { background: var(--surface2); }
.vtable tbody tr.vt-done { opacity: .4; }
.vtable td { padding: 11px 12px; vertical-align: middle; }
.vt-kanji { font-size: 17px; font-weight: 400; white-space: nowrap; }
.vt-kana { font-size: 11px; color: var(--green-txt); font-weight: 500; margin-top: 2px; }
.vt-trans { font-size: 13px; }
.vt-pos { font-size: 11px; color: var(--text2); white-space: nowrap; }
.vt-lv { font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 8px; white-space: nowrap; display: inline-block; }
.vt-spk { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all .12s; }
.vt-spk:hover { background: var(--accent-light); }
.vt-ex-jp { font-size: 12px; color: #2d6e4a; font-weight: 500; line-height: 1.6; }
.vt-ex-zh { font-size: 11px; color: var(--text3); line-height: 1.6; margin-top: 1px; }
.vt-ex-spk { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface); color: var(--text3); font-size: 10px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; margin-top: 4px; transition: all .12s; }
.vt-ex-spk:hover { background: var(--accent-light); color: var(--accent); }
.vt-ok { font-size: 12px; color: var(--accent); margin-right: 4px; }

.empty { text-align: center; padding: 48px 16px; color: var(--text3); font-size: 14px; }
.empty-icon { font-size: 32px; margin-bottom: 10px; }

/* toast */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 9px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; }

/* empty state for study */
.study-empty { text-align: center; padding: 60px 24px; }
.study-empty-icon { font-size: 40px; margin-bottom: 14px; }
.study-empty-title { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
.study-empty-sub { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 20px; }
.go-import-btn { height: 44px; padding: 0 24px; border-radius: 100px; border: none; background: var(--accent); color: white; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">日語単語帳</span>
  <span class="offline-badge">离线版</span>
  <div class="stat-row">
    <span id="tc-pill" class="pill">0</span>词
    &nbsp;·&nbsp;掌握<span id="mc-pill" class="pill">0</span>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="gotoTab('study',this)">🃏 学习</button>
  <button class="tab" onclick="gotoTab('list',this)">📚 词库</button>
  <button class="tab" onclick="gotoTab('import',this)">📥 导入</button>
</div>

<!-- STUDY -->
<div id="pane-study" class="pane on">
<div class="study-page" id="study-content">
  <!-- filled by JS -->
</div>
</div>

<!-- LIST -->
<div id="pane-list" class="pane">
<div class="list-page">
  <div class="list-toolbar">
    <input class="search-box" id="search-box" placeholder="搜索词汇…" oninput="doSearch(this.value)">
    <button class="lf-btn on" onclick="setLF('all',this)">全部</button>
    <button class="lf-btn" onclick="setLF('n5',this)">N5</button>
    <button class="lf-btn" onclick="setLF('n4',this)">N4</button>
    <button class="lf-btn" onclick="setLF('n3',this)">N3</button>
    <button class="lf-btn" onclick="setLF('n2',this)">N2</button>
    <button class="lf-btn" onclick="setLF('mastered',this)">已掌握</button>
  </div>
  <div class="vtable-wrap" id="vtable-wrap"></div>
</div>
</div>

<!-- IMPORT -->
<div id="pane-import" class="pane">
<div class="import-page">

  <div>
    <div class="import-title">📥 导入词库</div>
    <div class="import-sub" style="margin-top:6px">在 Claude 对话中完成题目分析后，下载 JSON 词库文件，然后导入到这里即可离线使用。</div>
  </div>

  <div class="steps">
    <div class="step"><div class="step-num">1</div><div class="step-txt">打开 Claude，使用<strong>「日语题目分析工具」</strong>上传试卷图片</div></div>
    <div class="step"><div class="step-num">2</div><div class="step-txt">分析完成后，选择要加入词库的单词，点击<strong>「下载词库 JSON」</strong></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-txt">回到这里，点击下方区域导入 JSON 文件</div></div>
    <div class="step"><div class="step-num">4</div><div class="step-txt">词库自动保存到本地，<strong>无需网络即可背单词</strong></div></div>
  </div>

  <div class="dropzone" id="dropzone"
    onclick="document.getElementById('json-inp').click()"
    ondragover="onDragOver(event)" ondrop="onDrop(event)"
    ondragleave="document.getElementById('dropzone').classList.remove('drag')">
    <div class="dz-icon">📂</div>
    <div class="dz-title">点击选择或拖拽 JSON 文件</div>
    <div class="dz-sub">从 Claude 下载的词库文件（.json）</div>
    <input type="file" id="json-inp" accept=".json,application/json" onchange="onFileSelect(event)">
  </div>

  <div class="import-info" id="import-info">
    <div class="import-stat" id="import-stat"></div>
    <button class="import-btn" onclick="doImport('replace')">⬇ 全部导入（覆盖现有词库）</button>
    <button class="import-btn merge" onclick="doImport('merge')">＋ 合并导入（保留现有词库）</button>
  </div>

  <div class="cur-lib" id="cur-lib">
    <div class="cur-lib-title">
      <span>当前词库</span>
      <div class="lib-actions">
        <button class="lib-act-btn" onclick="exportLib()">↑ 导出备份</button>
        <button class="lib-act-btn danger" onclick="clearLib()">✕ 清空词库</button>
      </div>
    </div>
    <div id="lib-info" style="font-size:13px;color:var(--text2)"></div>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ STORAGE ═══════════ */
const LS_VOCAB = 'jp_vocab_v2';
const LS_MASTERED = 'jp_mastered_v2';
const LS_PROGRESS = 'jp_progress_v2';

function loadVocab() {
  try { return JSON.parse(localStorage.getItem(LS_VOCAB) || '[]'); } catch { return []; }
}
function saveVocab(v) { localStorage.setItem(LS_VOCAB, JSON.stringify(v)); }
function loadMastered() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_MASTERED) || '[]')); } catch { return new Set(); }
}
function saveMastered() { localStorage.setItem(LS_MASTERED, JSON.stringify([...masteredSet])); }
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(LS_PROGRESS) || '{}'); } catch { return {}; }
}
function saveProgress() { localStorage.setItem(LS_PROGRESS, JSON.stringify(progress)); }

/* ═══════════ STATE ═══════════ */
let vocab = loadVocab();
let masteredSet = loadMastered();
let progress = loadProgress(); // {id: 'hard'|'ok'|'easy'}
let deck = [];
let cur = 0, flipped = false, studyMode = 'learn';
let posFilter = 'all', listLF = 'all', listSearch = '';
let pendingImport = null;

/* ═══════════ INIT ═══════════ */
buildDeck();
updateStats();
renderStudy();
updateLibInfo();

/* ═══════════ TABS ═══════════ */
function gotoTab(name, btn) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  document.getElementById('pane-' + name).classList.add('on');
  btn.classList.add('on');
  if (name === 'list') renderList();
  if (name === 'study') renderCard();
}

/* ═══════════ IMPORT / EXPORT ═══════════ */
function onDragOver(e) { e.preventDefault(); document.getElementById('dropzone').classList.add('drag'); }
function onDrop(e) {
  e.preventDefault(); document.getElementById('dropzone').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) readJsonFile(f);
}
function onFileSelect(e) { const f = e.target.files[0]; if (f) readJsonFile(f); }

function readJsonFile(f) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      // 支持两种格式：直接数组 或 {vocab:[...]} 包装格式
      const words = Array.isArray(data) ? data : (data.vocab || []);
      if (!words.length) { showToast('⚠ JSON 为空或格式错误'); return; }
      pendingImport = words;
      const existing = new Set(vocab.map(w => w.kanji));
      const newCount = words.filter(w => !existing.has(w.kanji)).length;
      document.getElementById('import-stat').innerHTML =
        `共 <strong>${words.length}</strong> 个词汇，其中 <strong style="color:var(--accent)">${newCount}</strong> 个为新词`;
      document.getElementById('import-info').classList.add('show');
    } catch {
      showToast('⚠ 文件格式错误，请导入正确的 JSON');
    }
  };
  reader.readAsText(f);
}

function doImport(mode) {
  if (!pendingImport) return;
  if (mode === 'replace') {
    vocab = pendingImport.map((w, i) => ({ ...w, id: w.id || (Date.now() + i) }));
  } else {
    const existing = new Set(vocab.map(w => w.kanji));
    const newWords = pendingImport.filter(w => !existing.has(w.kanji))
      .map((w, i) => ({ ...w, id: w.id || (Date.now() + i) }));
    vocab = [...vocab, ...newWords];
  }
  saveVocab(vocab);
  updateStats(); buildDeck(); renderCard(); updateLibInfo();
  document.getElementById('import-info').classList.remove('show');
  pendingImport = null;
  document.getElementById('json-inp').value = '';
  showToast(`✅ 导入成功，共 ${vocab.length} 个词汇`);
}

function exportLib() {
  if (!vocab.length) { showToast('词库为空'); return; }
  const blob = new Blob([JSON.stringify({ vocab, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `jp_vocab_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('✅ 已导出备份');
}

function clearLib() {
  if (!vocab.length) { showToast('词库已为空'); return; }
  if (!confirm(`确定清空全部 ${vocab.length} 个词汇？此操作不可恢复。`)) return;
  vocab = []; masteredSet = new Set(); progress = {};
  saveVocab(vocab); saveMastered(); saveProgress();
  updateStats(); buildDeck(); renderStudy(); updateLibInfo();
  showToast('词库已清空');
}

function updateLibInfo() {
  const el = document.getElementById('lib-info');
  if (!vocab.length) {
    el.innerHTML = '<span style="color:var(--text3)">暂无词汇，请先导入</span>';
    return;
  }
  const groups = {};
  vocab.forEach(w => { groups[w.level] = (groups[w.level] || 0) + 1; });
  const tags = Object.entries(groups).sort().map(([lv, n]) =>
    `<span class="lib-tag">${lv.toUpperCase()} · ${n}</span>`).join(' ');
  el.innerHTML = `共 <strong>${vocab.length}</strong> 词 &nbsp;${tags}&nbsp; · 已掌握 <strong style="color:var(--accent)">${masteredSet.size}</strong>`;
}

/* ═══════════ DECK ═══════════ */
function buildDeck() {
  deck = posFilter === 'all' ? [...vocab] : vocab.filter(w => w.pg === posFilter);
  if (cur >= deck.length) cur = 0;
  flipped = false;
}

function setPF(pg, btn) {
  posFilter = pg;
  document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  buildDeck(); cur = 0; renderCard();
}

function setMode(m, btn) {
  studyMode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  cur = 0; flipped = false;
  document.getElementById('card3d')?.classList.remove('flipped');
  renderCard();
}

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  cur = 0; flipped = false;
  document.getElementById('card3d')?.classList.remove('flipped');
  renderCard(); showToast('🔀 已打乱顺序');
}

/* ═══════════ STUDY RENDER ═══════════ */
function renderStudy() {
  const el = document.getElementById('study-content');
  if (!vocab.length) {
    el.innerHTML = `
      <div class="study-empty">
        <div class="study-empty-icon">📭</div>
        <div class="study-empty-title">词库还是空的</div>
        <div class="study-empty-sub">先去 Claude 对话中分析题目，<br>下载 JSON 后在「导入」页面导入</div>
        <button class="go-import-btn" onclick="gotoTab('import',document.querySelectorAll('.tab')[2])">去导入词库 →</button>
      </div>`;
    return;
  }
  el.innerHTML = `
    <div class="prog-row">
      <span class="prog-lbl" id="prog-lbl">第 1 / ${deck.length} 张</span>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:${deck.length?Math.round(1/deck.length*100):0}%"></div></div>
      <div class="mode-btns">
        <button class="mode-btn ${studyMode==='learn'?'on':''}" onclick="setMode('learn',this)">学习</button>
        <button class="mode-btn ${studyMode==='quiz'?'on':''}" onclick="setMode('quiz',this)">自测</button>
        <button class="mode-btn" onclick="shuffleCards()">↺</button>
      </div>
    </div>
    <div class="pos-filter">
      <span class="pos-lbl">筛选：</span>
      <button class="pos-btn ${posFilter==='all'?'on':''}" onclick="setPF('all',this)">全部(${vocab.length})</button>
      <button class="pos-btn ${posFilter==='动词'?'on':''}" onclick="setPF('动词',this)">动词</button>
      <button class="pos-btn ${posFilter==='形容词'?'on':''}" onclick="setPF('形容词',this)">形容词</button>
      <button class="pos-btn ${posFilter==='名词'?'on':''}" onclick="setPF('名词',this)">名词</button>
      <button class="pos-btn ${posFilter==='副词'?'on':''}" onclick="setPF('副词',this)">副词</button>
      <button class="pos-btn ${posFilter==='外来語'?'on':''}" onclick="setPF('外来語',this)">外来语</button>
    </div>
    <div class="card-scene" id="card-scene" onclick="onCardClick()" style="height:320px">
      <div class="card-3d" id="card3d" style="height:320px">
        <div class="card-face cf" id="cf-face">
          <span class="cf-hint">点击卡片查看释义</span>
          <span class="cf-src" id="cf-src"></span>
          <span class="cf-pos" id="cf-pos"></span>
          <div class="cf-kanji" id="cf-kanji"></div>
          <div class="cf-kana" id="cf-kana"></div>
          <div class="cf-roman" id="cf-roman"></div>
          <button class="spk-btn" id="cf-spk" onclick="event.stopPropagation();speakWord()">🔊</button>
        </div>
        <div class="card-face cb" id="cb-face">
          <div class="cb-top">
            <div class="cb-tw">
              <div class="cb-trans" id="cb-trans"></div>
              <div class="cb-pos" id="cb-pos"></div>
            </div>
            <button class="spk-btn" onclick="event.stopPropagation();speakWord()">🔊</button>
          </div>
          <div class="cb-scroll" id="cb-scroll">
            <div class="ex-block">
              <div class="ex-lbl">例句</div>
              <div class="ex-jp" id="ex-jp"></div>
              <div class="ex-kana" id="ex-kana"></div>
              <div class="ex-roman" id="ex-roman"></div>
              <div class="ex-audio-row">
                <button class="ex-spk" onclick="event.stopPropagation();speakEx()">🔊 朗读例句</button>
                <span class="ex-zh" id="ex-zh"></span>
              </div>
            </div>
            <div class="gm-block">
              <div class="gm-lbl">出题语法</div>
              <div class="gm-text" id="cb-gm"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="card-bottom">
      <div class="nav-row">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled>← 上一张</button>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">下一张 →</button>
      </div>
      <div class="rate-row" id="rate-row">
        <span class="rate-lbl">掌握程度：</span>
        <button class="rate-btn hard" onclick="rate('hard')">再看看</button>
        <button class="rate-btn ok" onclick="rate('ok')">还行</button>
        <button class="rate-btn easy" onclick="rate('easy')">已掌握 ✓</button>
      </div>
    </div>`;
  renderCard();
}

/* ═══════════ CARD ═══════════ */
const posColors = { '动词':'#e4f0ff,#1a5c9a','形容词':'#eee8ff,#4a2fa0','名词':'#ede8ff,#4c35b5','副词':'#e4fff5,#1a6a4a','外来語':'#fff3e8,#8a4a1a' };
const lvStyle = { n5:'background:#fdf7e4;color:#7a5e18',n4:'background:#e6f0fa;color:#1c4478',n3:'background:#e7f2eb;color:#2d5a3d',n2:'background:#fdf0ec;color:#8b3a2a',n1:'background:#f3edf8;color:#5a2d7a' };

function renderCard() {
  if (!deck.length) return;
  const w = deck[cur];
  flipped = false;
  document.getElementById('card3d')?.classList.remove('flipped');

  const pct = Math.round((cur + 1) / deck.length * 100);
  document.getElementById('prog-lbl').textContent = `第 ${cur + 1} / ${deck.length} 张`;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === deck.length - 1;

  document.getElementById('cf-src').textContent = w.src || '';
  const pb = document.getElementById('cf-pos');
  pb.textContent = w.pos;
  const pc = (posColors[w.pg] || '#ede8ff,#4c35b5').split(',');
  pb.style.cssText = `background:${pc[0]};color:${pc[1]};`;
  document.getElementById('cf-kanji').textContent = w.kanji;
  document.getElementById('cf-kana').textContent = w.kana;
  document.getElementById('cf-roman').textContent = w.roman;

  document.getElementById('cb-trans').textContent = w.trans;
  document.getElementById('cb-pos').textContent = w.pos;
  document.getElementById('ex-jp').textContent = w.ex_jp;
  document.getElementById('ex-kana').textContent = w.ex_kana;
  document.getElementById('ex-roman').textContent = w.ex_roman;
  document.getElementById('ex-zh').textContent = w.ex_zh;
  document.getElementById('cb-gm').innerHTML = w.gm || '';

  requestAnimationFrame(fixCardHeight);

  const qc = document.getElementById('quiz-choices');
  const rr = document.getElementById('rate-row');
  if (studyMode === 'quiz') { qc.classList.add('show'); rr.style.display = 'none'; renderQuiz(w); }
  else { qc.classList.remove('show'); rr.style.display = 'flex'; }
}

function fixCardHeight() {
  const cf = document.getElementById('cf-face');
  const cb = document.getElementById('cb-face');
  const scene = document.getElementById('card-scene');
  const card3d = document.getElementById('card3d');
  if (!cf || !cb || !scene) return;
  const h = Math.max(cf.scrollHeight, cb.scrollHeight, 280);
  scene.style.height = h + 'px';
  card3d.style.height = h + 'px';
  const cbScroll = document.getElementById('cb-scroll');
  if (cbScroll) cbScroll.style.maxHeight = (h - document.querySelector('.cb-top').scrollHeight - 2) + 'px';
}

function onCardClick() { if (studyMode === 'quiz') return; flipped = !flipped; document.getElementById('card3d').classList.toggle('flipped', flipped); }

/* ═══════════ QUIZ ═══════════ */
function renderQuiz(correct) {
  const pool = vocab.filter(w => w.id !== correct.id);
  const wrongs = [];
  while (wrongs.length < 3 && pool.length) { const i = Math.floor(Math.random() * pool.length); wrongs.push(pool.splice(i, 1)[0]); }
  const choices = [correct, ...wrongs].sort(() => Math.random() - .5);
  document.getElementById('quiz-choices').innerHTML = choices.map(c =>
    `<button class="qc-btn" data-id="${c.id}" onclick="checkQ(${c.id},${correct.id},this)">${c.trans}</button>`).join('');
}
function checkQ(chosen, cid, btn) {
  document.querySelectorAll('.qc-btn').forEach(b => b.onclick = null);
  if (chosen === cid) { btn.classList.add('correct'); }
  else { btn.classList.add('wrong'); document.querySelectorAll('.qc-btn').forEach(b => { if (parseInt(b.dataset.id) === cid) b.classList.add('correct'); }); }
  document.getElementById('card3d').classList.add('flipped');
  showToast(chosen === cid ? '✅ 正确！' : '❌ 再想想');
}

/* ═══════════ NAV / RATE ═══════════ */
function navigate(d) { const n = cur + d; if (n >= 0 && n < deck.length) { cur = n; renderCard(); } }
function rate(level) {
  const w = deck[cur];
  if (level === 'easy') { masteredSet.add(w.id); saveMastered(); showToast('✅ 已标记为掌握'); updateStats(); updateLibInfo(); }
  else if (level === 'hard') { masteredSet.delete(w.id); saveMastered(); updateStats(); updateLibInfo(); }
  progress[w.id] = level; saveProgress();
  if (cur < deck.length - 1) navigate(1); else showToast('🎉 本轮学习完成！');
}

/* ═══════════ AUDIO ═══════════ */
function speak(text, btn) {
  if (!text) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 0.88;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  if (btn) { btn.classList.add('spin'); setTimeout(() => btn.classList.remove('spin'), 600); }
}
function speakWord() { const w = deck[cur]; if (w) speak(w.kana, document.getElementById('cf-spk')); }
function speakEx() { const w = deck[cur]; if (w) speak(w.ex_jp); }

/* ═══════════ LIST ═══════════ */
function renderList() {
  const wrap = document.getElementById('vtable-wrap');
  const src = vocab.filter(w => {
    const lm = listLF === 'all' ? true : listLF === 'mastered' ? masteredSet.has(w.id) : w.level === listLF;
    const sm = !listSearch || w.kanji.includes(listSearch) || w.kana.includes(listSearch) || w.trans.includes(listSearch);
    return lm && sm;
  });
  if (!src.length) {
    wrap.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>没有匹配的词汇</div>';
    return;
  }
  wrap.innerHTML = `<table class="vtable">
    <thead><tr><th>汉字</th><th>译文</th><th>词性</th><th>等级</th><th>发音</th><th>例句</th></tr></thead>
    <tbody>${src.map(w => {
      const lv = lvStyle[w.level] || '';
      const done = masteredSet.has(w.id);
      const exS = (w.ex_jp || '').replace(/'/g, "\\'");
      const knS = (w.kana || '').replace(/'/g, "\\'");
      return `<tr class="${done ? 'vt-done' : ''}" onclick="jumpStudy(${w.id})">
        <td><div style="display:flex;align-items:center;gap:4px">${done ? '<span class="vt-ok">✓</span>' : ''}<div><div class="vt-kanji">${w.kanji}</div><div class="vt-kana">${w.kana}</div></div></div></td>
        <td class="vt-trans">${w.trans}</td>
        <td class="vt-pos">${w.pos}</td>
        <td><span class="vt-lv" style="${lv}">${(w.level || '').toUpperCase()}</span></td>
        <td><button class="vt-spk" onclick="event.stopPropagation();speak('${knS}')">🔊</button></td>
        <td><div class="vt-ex-jp">${w.ex_jp || ''}</div><div class="vt-ex-zh">${w.ex_zh || ''}</div><button class="vt-ex-spk" onclick="event.stopPropagation();speak('${exS}')">🔊 例句</button></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}
function doSearch(q) { listSearch = q; renderList(); }
function setLF(f, btn) { listLF = f; document.querySelectorAll('.lf-btn').forEach(b => b.classList.remove('on')); btn.classList.add('on'); renderList(); }
function jumpStudy(id) {
  const idx = deck.findIndex(w => w.id === id);
  if (idx >= 0) { cur = idx; gotoTab('study', document.querySelectorAll('.tab')[0]); renderCard(); }
}

/* ═══════════ STATS / UTILS ═══════════ */
function updateStats() { document.getElementById('tc-pill').textContent = vocab.length; document.getElementById('mc-pill').textContent = masteredSet.size; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
</script>
</body>
</html>
